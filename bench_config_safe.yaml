
server:
  port: 8081
  env: development
  auth_enabled: false
  api_keys: ["bench-key-12345"]
rate_limit:
  requests_per_second: 100000
  burst: 100000
log:
  level: "error"
database:
  path: "bench.db"
providers:
  - id: openai
    type: openai
    name: OpenAI
    api_key: "mock-key"
    base_url: "http://localhost:9091/v1"
    enabled: true
    requires_auth: true
  - id: elevenlabs
    type: elevenlabs
    name: ElevenLabs
    api_key: "your-elevenlabs-key"
    enabled: true
  - id: cosyvoice
    type: cosyvoice
    name: CosyVoice
    base_url: "http://localhost:50000"
    enabled: true
  - id: qwen3
    type: qwen3
    name: Qwen3-TTS
    base_url: "http://localhost:8000/v1"
    enabled: true
