server:
  port: 8080
  env: "development"
  auth_enabled: false
  read_timeout: "30s"
  read_header_timeout: "10s"
  write_timeout: "0s"
  idle_timeout: "2m"
  shutdown_timeout: "10s"

rate_limit:
  requests_per_second: 10.0
  burst: 20

log:
  level: "debug"

redis:
  enabled: false
  addr: "localhost:6379"

providers:
  - id: "openai"
    type: "openai"
    name: "OpenAI"
    api_key: "ENV:OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    enabled: true
    requires_auth: true

  - id: "anthropic"
    type: "anthropic"
    name: "Anthropic"
    api_key: "ENV:ANTHROPIC_API_KEY"
    base_url: "https://api.anthropic.com/v1"
    enabled: true
    requires_auth: true
    timeout: "10m"
    config:
      version: "2023-06-01"

  - id: "google"
    type: "google"
    name: "Google Gemini"
    api_key: "ENV:GOOGLE_API_KEY"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    enabled: true
    requires_auth: true

  - id: "ollama"
    type: "ollama"
    name: "Ollama"
    base_url: "ENV:OLLAMA_BASE_URL"
    enabled: true
    requires_auth: false

  - id: "bfl"
    type: "bfl"
    name: "Black Forest Labs"
    api_key: "ENV:BFL_API_KEY"
    base_url: "https://api.bfl.ai/v1"
    enabled: true
    requires_auth: true

  - id: "moonshot"
    type: "moonshot"
    name: "Moonshot AI"
    api_key: "ENV:MOONSHOT_API_KEY"
    base_url: "https://api.moonshot.ai/v1"
    enabled: true
    requires_auth: true

  - id: "deepseek"
    type: "deepseek"
    name: "DeepSeek"
    api_key: "ENV:DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    enabled: true
    requires_auth: true

  - id: "zai"
    type: "zai"
    name: "Z.ai"
    api_key: "ENV:ZAI_API_KEY"
    base_url: "https://api.z.ai/api/paas/v4"
    enabled: true
    requires_auth: true

  - id: "qwen"
    type: "qwen"
    name: "Alibaba Cloud Qwen"
    api_key: "ENV:DASHSCOPE_API_KEY"
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
    enabled: true
    requires_auth: true
    config:
      tts_base_url: "https://dashscope-intl.aliyuncs.com/api/v1"

  - id: "minimax"
    type: "minimax"
    name: "MiniMax"
    api_key: "ENV:MINIMAX_API_KEY"
    base_url: "https://api.minimax.io/v1"
    enabled: true
    requires_auth: true

  - id: "huggingface"
    type: "huggingface"
    name: "Hugging Face Inference Providers"
    api_key: "ENV:HF_TOKEN"
    base_url: "https://router.huggingface.co/v1"
    enabled: true
    requires_auth: true
